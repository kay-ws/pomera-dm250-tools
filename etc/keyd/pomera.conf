# Built-in tc3589x matrix keyboard (vendor/product IDs are both zero).
# Restrict to keyboards: GPIO power/lid input devices remain with logind.
[ids]
k:0000:0000

[main]
# Tap: normal Muhenkan. Hold with another key: navigation layer.
muhenkan = overload(navigation, muhenkan)
# menu/help (KEY_LEFTMETA): still Meta (sway's $mod) for every key not listed in [menu].
leftmeta = layer(menu)

[navigation]
up = pageup
down = pagedown
left = home
right = end
f1 = command(/usr/local/bin/backlight --decrease)
f2 = command(/usr/local/bin/backlight --increase)

# Same combinations as on the 3.10 image (dm250-nav.map): the keyboard has exactly 80 physical keys and
# none of these six. A key listed here is sent without Meta; every other key is sent as Meta+key.
[menu:M]
left = home
right = end
up = pageup
down = pagedown
f1 = f11
f2 = f12
